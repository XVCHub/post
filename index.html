<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #000;
            color: #fff;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .inner {
            display: flex;
            flex-direction: column;
            justify-items: center;
            align-items: center;
            margin-left: auto;
            margin-right: auto;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            gap: 10px;
        }
        
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .support {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 2px;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .support:hover {
            color: #fff;
        }
        
        .support svg {
            width: 24px;
            height: 24px;
        }
        
        .copied {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-size: 14px;
        }
        
        .copied.show {
            opacity: 1;
        }
    </style>
</head>
