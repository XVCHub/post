<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xvchub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="backgroundVideo" playsinline loop disablePictureInPicture autoplay muted preload="auto">
        <source src="bg.mp4" type="video/mp4">
    </video>
    <audio id="backgroundMusic" autoplay loop preload="auto"></audio>

    <div class="background-overlay"></div>

    <div id="landingPage">
        <div class="enter-prompt">
            <span class="enter-text">click to enter</span>
        </div>
    </div>

    <main id="mainContent" class="hidden">
        <div class="toggle-container">
            <button id="modeToggle" class="mode-toggle">loader</button>
        </div>

        <div class="center-buttons">
            <button id="copyScript" class="main-btn">copy script</button>
            <a href="https://discord.gg/rTw5M8dRXN" target="_blank" class="main-btn discord-btn">join discord</a>
        </div>

        <div class="media-controls">
            <button id="muteButton" class="control-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
            <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.1">
        </div>
    </main>

    <div id="visualizer"></div>
    
    <script type="module" src="script.js"></script>
</body>
</html>
