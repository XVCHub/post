<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Topo Background</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: #0b0f14;
  overflow: hidden;
  font-family: sans-serif;
}

/* Topographic background */
.bg {
  position: fixed;
  inset: 0;
  background-color: #0b0f14;
  background-image: url("data:image/svg+xml,%3Csvg width='800' height='800' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%231a2a3a' stroke-width='1'%3E%3Cpath d='M0 400 Q200 150 400 400 T800 400'/%3E%3Cpath d='M0 450 Q250 200 400 450 T800 450'/%3E%3Cpath d='M0 350 Q220 120 400 350 T800 350'/%3E%3Cpath d='M0 500 Q300 250 400 500 T800 500'/%3E%3Cpath d='M0 300 Q260 80 400 300 T800 300'/%3E%3C/g%3E%3C/svg%3E");
  background-size: 800px 800px;
  opacity: 0.35;
}

/* Demo content */
.center {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 32px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="center">
  Topographic Background
</div>

</body>
</html>
