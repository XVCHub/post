<!DOCTYPE html>
<html>
<head>
  <title>post counter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .container {
      text-align: center;
      color: white;
    }
    .count {
      font-size: 120px;
      font-weight: 900;
      text-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    .count.bump {
      transform: scale(1.2);
    }
    .label {
      font-size: 24px;
      opacity: 0.9;
      margin-top: 20px;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      opacity: 0.7;
    }
    .status.live {
      color: #4ade80;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .endpoint {
      margin-top: 50px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }
    .endpoint-title {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 10px;
    }
    code {
      display: block;
      background: rgba(0,0,0,0.2);
      padding: 10px 15px;
      border-radius: 8px;
      margin: 5px 0;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="count" id="count">0</div>
    <div class="label">total requests</div>
    <div class="status live">
      <span class="dot"></span>
      <span>live updates</span>
    </div>
    
    <div class="endpoint">
      <div class="endpoint-title">api endpoints</div>
      <code>GET /api → get count</code>
      <code>POST /api → increment count</code>
    </div>
  </div>
  
  <script>
    const countEl = document.getElementById('count')
    let lastCount = 0
    
    async function loadCount() {
      try {
        const res = await fetch('/api')
        const data = await res.json()
        const newCount = data.total_posts
        
        if (newCount !== lastCount) {
          countEl.classList.add('bump')
          setTimeout(() => countEl.classList.remove('bump'), 300)
          lastCount = newCount
        }
        
        countEl.textContent = newCount
      } catch (err) {
        console.error('failed to load count:', err)
      }
    }
    
    loadCount()
    setInterval(loadCount, 1000)
  </script>
</body>
</html>
